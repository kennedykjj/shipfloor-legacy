name: CI

# The whole test suite, on every pull request. The factory's deploy merges only with this job green on
# the PR's head (deploy.required_checks in .shipfloor/factory.yml), and that head already contains main:
# a second run on main after the merge would test the same tree, and every job costs a minute at least.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
      - name: Test suite
        env:
          TEST_JOBS: 4   # the default is half the CPUs, and the tests mostly wait on git and subprocesses
        run: bash scripts/test/run.sh

  # macOS and Windows (#154): reported, not gating. The deploy reads any red check as a failed CI, so a failing
  # suite here leaves the job green with a warning; only the Linux `test` job gates a merge (deploy.required_checks).
  # The owner decides after a week whether these join required_checks (#154, AC-6).
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash   # Git Bash on Windows
    steps:
      - uses: actions/checkout@v4
      - name: Bash 4.4+ (macOS ships 3.2)
        if: runner.os == 'macOS'
        # before setup-python: Homebrew's bin also holds a python3 without PyYAML, and the later PATH entry wins
        run: brew install --quiet bash && echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Versions
        run: |
          bash --version | head -1
          python --version
          python -c 'import yaml; print("PyYAML", yaml.__version__)'
          if command -v python3 >/dev/null; then python3 -c 'import sys, yaml; print("python3:", sys.executable, "PyYAML", yaml.__version__)'; fi
      - name: Test suite
        id: suite
        continue-on-error: true
        env:
          TEST_JOBS: 4
        run: bash scripts/test/run.sh
      - name: Outcome
        if: steps.suite.outcome == 'failure'
        run: |
          echo "::warning title=Suite failed on ${{ matrix.os }}::the suite failed on ${{ matrix.os }}; it does not gate the merge yet (#154)"
          echo "### The suite failed on ${{ matrix.os }} (not gating yet, #154)" >> "$GITHUB_STEP_SUMMARY"

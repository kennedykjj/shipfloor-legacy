name: CI

# The whole test suite, on every pull request. The factory's deploy merges only with the `test` job green on
# the PR's head (deploy.required_checks in .shipfloor/factory.yml), and that head already contains main:
# a second run on main after the merge would test the same tree, and every job costs a minute at least.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The suite split over three runners by kind of test (run.sh SUITE=<name>, the "# suite:" line of each file): a red
  # job says which kind failed. unit: in-process modules; integration: real processes, git, the fakes; end-to-end:
  # the whole factory (chaos, the demo stack, a browser).
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, end-to-end]
    name: suite (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
      - name: PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
      # end-to-end runs the dashboard's browser tests (#234): Playwright and Chromium in their own venv, and
      # BROWSER_TESTS=required turns a missing browser into a FAIL instead of a skip
      # the venv and Chromium are cached by the requirements file: a hit skips the pip install and the browser
      # download; the runner image already has the system libraries headless Chromium needs
      - name: Cache Playwright (end-to-end)
        if: matrix.suite == 'end-to-end'
        id: pwcache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/browser
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/test/requirements-browser.txt') }}
      - name: Playwright and Chromium (end-to-end)
        if: matrix.suite == 'end-to-end'
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" != true ]; then
            python3 -m venv "$RUNNER_TEMP/browser"
            "$RUNNER_TEMP/browser/bin/pip" install --quiet -r scripts/test/requirements-browser.txt
            "$RUNNER_TEMP/browser/bin/python" -m playwright install --with-deps chromium
          fi
          echo "BROWSER_PYTHON=$RUNNER_TEMP/browser/bin/python" >> "$GITHUB_ENV"
          echo "BROWSER_TESTS=required" >> "$GITHUB_ENV"
      - name: Test suite, ${{ matrix.suite }}
        env:
          TEST_JOBS: 4   # one per vCPU: more only makes the process starts compete
          SUITE: ${{ matrix.suite }}
        run: bash scripts/test/run.sh

  # The one check the ruleset and deploy.required_checks name: green only when every suite is.
  test:
    runs-on: ubuntu-latest
    needs: suite
    if: always()
    steps:
      - name: Every suite passed
        run: '[ "${{ needs.suite.result }}" = success ] || { echo "suite: ${{ needs.suite.result }}"; exit 1; }'

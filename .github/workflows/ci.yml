name: CI

# The whole test suite, on every pull request. The factory's deploy merges only with the `test` job green on
# the PR's head (deploy.required_checks in .shipfloor/factory.yml), and that head already contains main:
# a second run on main after the merge would test the same tree, and every job costs a minute at least.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The suite split over three runners (run.sh SHARD=i/N): its wall time is about a third of one runner's.
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: suite (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v4
      - name: PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
      - name: Test suite, shard ${{ matrix.shard }} of 3
        env:
          TEST_JOBS: 4   # one per vCPU: more only makes the process starts compete
          SHARD: ${{ matrix.shard }}/3
        run: bash scripts/test/run.sh

  # The dashboard's JavaScript in headless Chromium (#234). The shards skip these tests (no Playwright there);
  # here BROWSER_TESTS=required turns a missing Playwright or Chromium into a FAIL instead of a skip.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/test/requirements-browser.txt
      - name: Playwright and Chromium
        run: |
          python -m pip install --quiet -r scripts/test/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Browser tests
        env:
          BROWSER_TESTS: required
          BROWSER_PYTHON: python
        run: bash scripts/test/run.sh dashboard-browser.test.sh

  # The one check the ruleset and deploy.required_checks name: green only when every shard and the browser job are.
  test:
    runs-on: ubuntu-latest
    needs: [suite, browser]
    if: always()
    steps:
      - name: Every shard and the browser job passed
        run: |
          [ "${{ needs.suite.result }}" = success ] || { echo "suite: ${{ needs.suite.result }}"; exit 1; }
          [ "${{ needs.browser.result }}" = success ] || { echo "browser: ${{ needs.browser.result }}"; exit 1; }

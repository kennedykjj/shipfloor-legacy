# .shipfloor/factory.yml — what the factory needs to know about this repository.
# Copy to .shipfloor/factory.yml, adjust, commit to the main branch, then run `shipfloor add <this repo>`.
# The factory always reads this file from origin/main, never from a branch under work.

project:
  name: shop                 # slug: [a-z0-9-]; names ~/.shipfloor/projects/<name>
  repo: acme/shop            # owner/repo on GitHub
  # main: main               # default branch (default: main)

board: {owner: acme, number: 3}   # GitHub Project v2 (user or organization); `shipfloor setup-board shop` sets its columns

# language: pt-BR                  # what people read about this project: specs, comments, reports, gate output (default: en)
context: [PRODUCT.md, CLAUDE.md]  # what PO, UX, Cybersec and the Tech Lead read about the product
# review_criteria: .shipfloor/review-criteria.md   # default: the plugin's generic criteria
# forbidden: [docs/engineering/]               # extra paths agents may never change
# trusted_commenters: [alice, bob]             # whose issue comments the agents read, besides the factory's own GitHub user
#                                              # (default: nobody else; ['*'] is anyone: only for a private repository)
# acceptance_assertions: 'assert|expect\('   # let through edits to acceptance tests that touch no assertion line (default: every edit blocks)
# paths: {specs: docs/superpowers/specs/, plans: docs/superpowers/plans/}
# limits:                                      # cards in the WIP columns
#   refine: {wip: 2}                           # Spec Review
#   develop: {wip: 4}                          # Coding + Validation
# (runs at once: the machine pool in ~/.shipfloor/config.yml, `shipfloor pool`; deploys are one at a time per project)

layers:
  # Each layer: the area one implementer owns (path), how to build it, and how to run selected
  # tests. Commands run from the layer's directory; {selector} reaches the runner as one argument.
  - name: api
    path: api/
    stack: Go 1.23, chi, sqlc
    build: go vet ./... && go test ./...
    test: go test ./... -run {selector} -v
    ran: '^--- PASS'               # regex proving at least one test ran
    assertions: '^[[:space:]]+[^ ]+_test\.go:[0-9]+:'   # extra ERE (grep -E) for a real assertion failure (red gate)
    tests: ['api/**/*_test.go']    # where QA writes this layer's tests
    migrations: {glob: 'api/migrations/*.sql', comment: '--', version: '^([0-9]+)_'}   # version: one regex group
    # agent: go-engineer           # a project agent in .claude/agents/ (default: the generic engineer)

  - name: web
    path: web/
    stack: Next.js 15, TypeScript, Tailwind
    build: npm run typecheck && npm test
    test: npx vitest run {selector}
    ran: 'Tests +[1-9][0-9]* passed'
    tests: ['web/**/*.test.ts', 'web/**/*.test.tsx']
    test_config: ['web/vitest.config.*', 'web/playwright.config.*']   # implementers may not touch these

  - name: e2e                      # tests only: QA writes them, nobody implements here
    path: web/
    tests_only: true
    needs_stack: true              # red/green take the shared stack lock
    test: npx playwright test {selector}
    ran: '[1-9][0-9]* passed'
    tests: ['web/e2e/**']

stack: {url: "http://localhost:3000"}                  # a local stack the e2e tests and UX checks share
deploy: {ci_workflow: CI, environment: production, timeout_min: 30, conflict_max_files: 5, conflict_max_hunks: 20, fix_max_files: 3, fix_max_lines: 40, refresh_staged: false}   # omit ci/environment to finish at the merge

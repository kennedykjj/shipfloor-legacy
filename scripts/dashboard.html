<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aghanim's Anvil</title>
<style>
:root {
  --ground: #0d1014;
  --panel: #151a21;
  --panel-hi: #1b212a;
  --edge: #262e39;
  --edge-hi: #36404e;
  --text: #ebe5d5;
  --muted: #8f8b80;
  --faint: #8b887f;
  --gold: #e2b356;
  --gold-soft: rgba(226, 179, 86, .28);
  --coin: #e2b356;
  --azure: #63b2ff;
  --azure-soft: rgba(99, 178, 255, .16);
  --azure-ink: #0b2440;
  --ok: #7cc58a;
  --warn: #d9a45b;
  --bad: #f06a5f;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --ground: #e7e7e4;
    --panel: #f4f4f2;
    --panel-hi: #fbfbfa;
    --edge: #d9d9d4;
    --edge-hi: #c4c4bd;
    --text: #23262b;
    --muted: #5a5955;
    --faint: #686661;
    --gold: #855a0c;
    --gold-soft: rgba(154, 107, 18, .25);
    --coin: #c99a3c;
    --azure: #1a5fb4;
    --azure-soft: rgba(26, 95, 180, .1);
    --azure-ink: #ffffff;
    --ok: #2f7d43;
    --warn: #9a5b12;
    --bad: #c23b31;
    --shadow: 0 10px 30px rgba(40, 36, 28, .14);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ground); color: var(--text);
  font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; overflow: hidden;
}
::selection { background: var(--azure-soft); color: var(--text); }
a { color: inherit; text-decoration-color: var(--edge-hi); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
button, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; border-radius: 4px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.gold { color: var(--gold); }
/* the coin: a small struck disc, lit from the top left, with a darker rim */
.coin::before {
  content: ""; display: inline-block; width: .66em; height: .66em; margin-right: .34em;
  border-radius: 50%; vertical-align: -.02em;
  background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .6), transparent 42%), var(--coin);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--coin) 60%, #4a3206), 0 0 0 1px var(--gold-soft);
}
.est { color: var(--faint); font-size: 11px; margin-left: 4px; font-family: var(--sans); letter-spacing: 0; cursor: help; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 5px; border: 2px solid var(--ground); }
::-webkit-scrollbar-track { background: transparent; }

/* top strip */
header {
  display: flex; align-items: stretch; gap: 0; padding: 0 20px;
  border-bottom: 1px solid var(--edge); background: var(--panel); flex: none;
}
.brand { display: flex; align-items: center; padding: 0 22px 0 0; margin-right: 6px; border-right: 1px solid var(--edge); }
.brand b { font-weight: 600; letter-spacing: .01em; }
.stat { padding: 11px 18px; border-right: 1px solid var(--edge); display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.stat .v { font-size: 19px; font-weight: 600; line-height: 1.15; white-space: nowrap; }
.stat .v small { font-size: 13px; color: var(--faint); font-weight: 500; }
.stat .k { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
kbd { font: 11px var(--mono); padding: 0 4px; border: 1px solid var(--edge-hi); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); margin-left: 4px; cursor: help; }
.slots { display: flex; gap: 14px; }
.slot .v { font-size: 15px; }
.meter { height: 3px; background: var(--edge); border-radius: 4px; margin-top: 5px; overflow: hidden; width: 100%; }
.meter i { display: block; height: 100%; background: var(--text); opacity: .75; }
.await .v { color: var(--azure); }
.await.none .v { color: var(--muted); }
.await { display: grid; grid-template-columns: auto auto; column-gap: 10px; align-content: center; justify-content: start; }
.await .k { grid-column: 1 / -1; grid-row: 2; }
.await .list { grid-row: 1; grid-column: 2; align-self: center; display: flex; gap: 6px; flex-wrap: wrap; }
.await .list button {
  border: 1px solid var(--azure-soft); background: var(--azure-soft); color: var(--azure);
  border-radius: 4px; padding: 0 6px; font: 12px var(--mono); cursor: pointer;
}
.await .list button:hover { border-color: var(--azure); }
.state { margin-left: auto; border-right: 0; align-items: flex-end; text-align: right; }
.flags { display: flex; gap: 8px; justify-content: flex-end; }
.flag { font-size: 12px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--edge-hi); color: var(--muted); }
.flag.warn { color: var(--warn); border-color: currentColor; }
.flag.bad { color: var(--bad); border-color: currentColor; }
.state .k { cursor: help; }
select { background: var(--panel-hi); border: 1px solid var(--edge); border-radius: 4px; padding: 2px 6px; }

/* board */
main { flex: 1; display: flex; min-height: 0; position: relative; }
.board { flex: 1; display: flex; overflow-x: auto; min-width: 0; }
.lane { flex: 1 1 180px; min-width: 176px; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--edge); }
.lane.none { flex: 0 0 104px; min-width: 104px; }
.lane:last-child { border-right: 0; }
.lane.pair { background: color-mix(in srgb, var(--panel) 45%, transparent); }
.col { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
.lane.pair .col:first-child { flex: 0 1 auto; max-height: 50%; }
.lane.pair .col + .col { border-top: 1px solid var(--edge); }
.col h2 {
  margin: 0; padding: 14px 14px 10px; font-size: 12px; font-weight: 600; color: var(--muted);
  display: flex; align-items: center; gap: 6px; flex: none;
}
.col h2 .n { margin-left: auto; color: var(--faint); font-weight: 500; }
.col h2 .yours { color: var(--azure); font-weight: 500; }
.col .more-btn { flex: none; background: none; border: 1px dashed var(--edge-hi); border-radius: 6px; padding: 6px 10px; color: var(--muted); cursor: pointer; font-size: 12.5px; text-align: left; }
.col .more-btn:hover { color: var(--text); border-color: var(--text); }
.lane.none .col h2 { white-space: normal; line-height: 1.3; align-items: flex-start; }
.clock { margin-left: auto; color: var(--muted); font-size: 11.5px; }
.col.owner h2 { color: var(--text); }
.col .cards { overflow-y: auto; padding: 0 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.board.more-x { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.col .cards.more { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 34px), transparent); mask-image: linear-gradient(180deg, #000 calc(100% - 34px), transparent); }

.card {
  flex: none; position: relative; display: block; width: 100%; text-align: left; cursor: pointer;
  background: linear-gradient(180deg, var(--panel-hi), var(--panel));
  border: 1px solid var(--edge); border-top-color: var(--edge-hi); border-radius: 6px;
  padding: 9px 10px 9px; overflow: hidden; transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
}
.card:hover { border-color: var(--edge-hi); transform: translateY(-1px); box-shadow: var(--shadow); }
.card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .no { font-size: 12.5px; color: var(--muted); }
.card.await .no { color: var(--text); }
.card .cost { font-size: 12.5px; }
.card .cost .spent { color: var(--muted); }
.card .title { margin-top: 3px; font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.untitled { color: var(--faint); font-style: italic; }
.card .run { margin-top: 6px; font-size: 11.5px; color: var(--text); display: flex; align-items: center; gap: 6px; }
.dial {
  width: 13px; height: 13px; border-radius: 50%; flex: none; display: inline-block;
  background: conic-gradient(var(--text) var(--sweep, 90deg), var(--edge-hi) 0);
  box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--edge);
  animation: sweep 6s linear infinite;
}
@property --sweep { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes sweep { from { --sweep: 0deg; } to { --sweep: 360deg; } }
.card.running { border-color: var(--edge-hi); }
.card .blocked { margin-top: 7px; display: inline-block; font-size: 12px; line-height: 1.3; padding: 0 6px; border: 1px solid var(--edge-hi); border-radius: 4px; color: var(--muted); }
.card .blocked b { color: var(--bad); font-weight: 600; }
.card .blocked.infra b { color: var(--warn); }
/* a block note: the one line that explains, the failed gate, the full report folded */
.block-note { margin-top: 14px; padding: 10px 12px; border: 1px solid var(--edge-hi); border-radius: 6px; font-size: 12.5px; display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: start; }
.block-note .bn-k { color: var(--muted); }
.block-note .bn-k b { color: var(--bad); font-weight: 600; }
.block-note.infra .bn-k b { color: var(--warn); }
.block-note .bn-lead { grid-column: 1; margin: 0; color: var(--text); }
.block-note .bn-gate { grid-column: 1; margin: 0; color: var(--muted); }
.block-note .btn { grid-column: 2; grid-row: 1 / span 3; align-self: start; }
.block-note details { grid-column: 1 / -1; color: var(--muted); }
.block-note summary { cursor: pointer; width: max-content; }
.block-note summary:hover { color: var(--text); }
.block-note .md { margin-top: 6px; max-height: 16em; overflow: auto; padding-right: 6px; }
.block-note .md p { margin: 4px 0; } .block-note .md .h { color: var(--text); font-weight: 600; }
.block-note .md ul { margin: 4px 0; padding-left: 18px; } .block-note .md li { margin: 2px 0; }
.block-note .md pre { margin: 4px 0; padding: 6px 8px; background: var(--ground); border-radius: 4px; font: 11.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
.block-note code { font: 11.5px var(--mono); }
.block-note .bn-err { grid-column: 1 / -1; color: var(--bad); }
.block-note .bn-err:empty { display: none; }
.stat.stacks.stuck .v { color: var(--warn); }
.card.await { border-color: var(--azure); box-shadow: 0 0 0 1px var(--azure) inset; background: linear-gradient(180deg, var(--azure-soft), var(--panel)); }
.card .waits { margin-top: 6px; font-size: 11.5px; color: var(--azure); }
/* an item that waits for the owner: its top edge is lit in azure and its waits line becomes the
   item's footer band, ruled like the tooltip head but in the owner's color */
.card.await { border-top-color: color-mix(in srgb, var(--azure) 55%, var(--text)); }
.card.await .waits { margin: 9px -10px -9px; padding: 6px 10px 7px; border-top: 1px solid color-mix(in srgb, var(--azure) 45%, transparent); background: var(--azure-soft); font-size: 12px; font-weight: 600; letter-spacing: .01em; }
.card.moving { opacity: .55; }
.card.open { border-color: var(--text); }
@media (prefers-reduced-motion: reduce) {
  .dial { animation: none; --sweep: 90deg; }
  .card, .drawer { transition: none; }
  .skeleton { animation: none; }
}

/* drawer: the item tooltip */
.drawer {
  position: absolute; top: 0; right: 0; bottom: 0; z-index: 2; width: 0; overflow: hidden; background: var(--panel);
  border-left: 1px solid var(--edge-hi); box-shadow: -14px 0 32px -8px rgba(0, 0, 0, .45);
  display: flex; flex-direction: column; container-type: inline-size;
}
.drawer:not(.open) { box-shadow: none; border: 0; }
.drawer.open { width: min(660px, 52vw); }
/* cards that wait for the owner keep the review's width on every tab, so tabs never reflow the drawer */
.drawer.wide { width: min(1180px, 72vw); }
.tip-head { padding: 16px 20px 14px; border-top: 1px solid var(--edge-hi); border-bottom: 1px solid color-mix(in srgb, var(--gold) 60%, transparent); background: linear-gradient(180deg, var(--panel-hi), var(--panel)); flex: none; }
.tip-head .row1 { padding-right: 76px; }
.tip-head h3 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.tip-head h3:focus { outline: none; }
.tip-head h3 .num { color: var(--muted); font-weight: 500; margin-right: 8px; }
#d-close { position: absolute; top: 16px; right: 20px; z-index: 1; }
.drawer:not(.open) #d-close { display: none; }
.tip-head .close, #d-close { flex: none; background: none; border: 1px solid var(--edge); border-radius: 5px; color: var(--muted); cursor: pointer; font-size: 12.5px; padding: 3px 9px; }
#d-close:hover, .tip-head .close:hover { color: var(--text); border-color: var(--edge-hi); }
.tip-head .meta { margin-top: 6px; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; }
.tip-head .meta .wait { color: var(--azure); }
.tip-head .meta .live { color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
.tip-stats { margin: 14px 0 0; display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 4px 28px; }
.tip-stats div { min-width: 0; }
.tip-stats dt { font-size: 12px; color: var(--muted); }
.tip-stats dd { margin: 2px 0 0; font-size: 15px; font-weight: 600; white-space: nowrap; }
.tip-stats .total dd { font-size: 20px; line-height: 1.1; }
.tip-stats .report dd { font: 500 13px var(--sans); padding-top: 3px; }
.tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--edge); flex: none; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 10px 8px; color: var(--muted); cursor: pointer; font-size: 13px; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
.tabs button .b { margin-left: 5px; font-size: 11px; color: var(--faint); }
.pane { flex: 1; overflow: auto; min-height: 0; }
.section-k { font-size: 11px; color: var(--muted); letter-spacing: .02em; margin: 14px 20px 6px; font-weight: 600; }

table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: right; font-weight: 500; color: var(--muted); font-size: 11px; padding: 10px 6px 6px; border-bottom: 1px solid var(--edge); white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--edge); white-space: nowrap; }
th:first-child, td:first-child { padding-left: 20px; text-align: left; }
th:last-child, td:last-child { padding-right: 20px; }
th.l, td.l { text-align: left; }
tbody tr.session { cursor: pointer; }
tbody tr.session:hover td { background: var(--panel-hi); }
tr.sub td { color: var(--muted); font-size: 12px; border-bottom-style: dashed; }
tr.total td { border-bottom: 0; font-weight: 600; padding-top: 10px; }
.subtoggle { background: none; border: 1px solid var(--edge); border-radius: 4px; padding: 0 5px; font: 11px var(--mono); color: var(--muted); cursor: pointer; margin-left: 6px; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .muted { color: var(--muted); }
.unpriced { color: var(--gold); cursor: help; text-decoration: underline dotted; }

.logwrap { display: flex; flex-direction: column; height: 100%; }
.logwrap .log { flex: 1; overflow: auto; min-height: 0; }
.log { margin: 0; padding: 14px 20px 30px; font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; color: var(--text); }
.logbar { display: flex; gap: 10px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--edge); font-size: 12.5px; color: var(--muted); flex: none; background: var(--panel); }

.gate-run { padding: 4px 20px 14px; border-bottom: 1px solid var(--edge); }
.gate-run .h { display: flex; justify-content: space-between; font-size: 13px; padding-top: 10px; }
.gate-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.gate { font: 11.5px var(--mono); padding: 2px 7px; border-radius: 4px; border: 1px solid var(--edge); }
.gate.pass { color: var(--ok); }
.gate.fail { color: var(--bad); border-color: currentColor; }
.notes { margin-top: 8px; color: var(--muted); font-size: 12.5px; }

/* the decision: under the tooltip head, whatever tab is open */
.decide { padding: 12px 20px 14px; border-bottom: 1px solid var(--edge); display: flex; flex-direction: column; gap: 10px; flex: none; }
.decide-k { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12px; color: var(--muted); }
.decide-k b { color: var(--text); font-weight: 600; }
.decide-a { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.decide-a .hint { font-size: 12.5px; color: var(--muted); }
.decide .stale { margin: 0; font-size: 12.5px; color: var(--warn); }
.decide-b { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
.decide-b .acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.btn { border-radius: 5px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--edge-hi); background: var(--panel-hi); white-space: nowrap; }
.btn:hover { border-color: var(--text); }
.btn.approve { background: var(--azure); border-color: var(--azure); color: var(--azure-ink); font-weight: 600; }
.btn.approve:hover { filter: brightness(1.08); }
.btn.approve.soft { background: var(--azure-soft); color: var(--azure); }
.btn.approve.soft:hover { filter: none; border-color: var(--azure); background: color-mix(in srgb, var(--azure) 24%, transparent); }
.btn.ghost { background: none; border-color: var(--edge); color: var(--muted); padding: 4px 10px; font-size: 12.5px; }
.btn.ghost:hover { color: var(--text); border-color: var(--edge-hi); }
.btn:disabled, .btn:disabled:hover { cursor: not-allowed; color: var(--faint); background: var(--panel); border-color: var(--edge); filter: none; }
.btn.approve:disabled { opacity: .6; color: var(--azure-ink); background: var(--azure); }
.drawer.busy .btn:disabled { cursor: progress; }
textarea { width: 100%; min-height: 38px; height: 38px; resize: vertical; background: var(--ground); border: 1px solid var(--edge); border-radius: 5px; padding: 7px 9px; transition: height .16s ease; }
textarea:focus, textarea.filled { height: 96px; }
textarea::placeholder { color: var(--faint); }
.notice { font-size: 12.5px; color: var(--bad); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.notice:empty { display: none; }
.notice.good { color: var(--ok); }
.notice .btn { color: var(--text); }
iframe { flex: 1; width: 100%; border: 0; background: #fff; min-height: 0; }
.review { display: flex; flex-direction: column; height: 100%; }
.review .none { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--edge); font-size: 12.5px; color: var(--muted); }
.placeholder { padding: 20px; color: var(--muted); max-width: 64ch; }
.skeleton { height: 14px; margin: 14px 20px; border-radius: 4px; background: linear-gradient(90deg, var(--edge), var(--panel-hi), var(--edge)); background-size: 200% 100%; animation: shimmer 1.2s ease infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

@container (max-width: 540px) {
  .decide-b { grid-template-columns: 1fr; }
  .decide-b .acts { flex-direction: row; flex-wrap: wrap; }
  .decide .btn { white-space: normal; text-align: left; }
  .tip-stats { grid-template-columns: repeat(2, auto); gap: 8px 28px; }
  #changes:not(.show) { display: none; }
  .block-note { grid-template-columns: 1fr; }
  .block-note .btn { grid-column: 1; grid-row: auto; justify-self: start; }
}
@media (max-width: 860px) {
  header { flex-wrap: wrap; padding: 4px 12px; }
  .brand { border-right: 0; padding: 8px 14px 8px 0; margin-right: 0; }
  .stat { padding: 6px 14px 6px 0; border-right: 0; }
  .state { margin-left: 0; align-items: flex-start; text-align: left; }
  .drawer.open, .drawer.wide { width: 100%; }
}
@media (max-width: 600px) {
  .brand { width: 100%; padding-bottom: 0; }
  #slots-stat { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Aghanim's Anvil</b></div>
  <div class="stat await none" id="await"><div class="v num" id="await-n">–</div><div class="k">awaiting you<kbd title="Press n to open the next card that waits for you">n</kbd></div><div class="list" id="await-list"></div></div>
  <div class="stat"><div class="v num" id="pool">–</div><div class="k">pool in use</div></div>
  <div class="stat" id="slots-stat"><div class="slots" id="slots"></div></div>
  <div class="stat"><div class="v num" id="today">–</div><div class="k" id="today-k">runs today</div></div>
  <div class="stat"><div class="v num gold" id="cost">–</div><div class="k">spent today <span class="est" title="Estimated from the run transcripts' tokens and ~/.aghanim/prices.yml">est.</span></div></div>
  <div class="stat stacks" id="stacks-cell"><div class="v num" id="stacks">–</div><div class="k" id="stacks-k">stacks</div></div>
  <div class="stat state"><div class="flags" id="flags" role="status"></div><div class="k" id="age" title="The board comes from the dispatcher's last snapshot. Approve and Request changes read the live board before they move a card."></div></div>
</header>
<main>
  <section class="board" id="board" aria-label="Board"><p class="placeholder">Reading the factory…</p></section>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="tip-title" inert>
    <div id="d-head"></div>
    <div id="d-decide"></div>
    <nav class="tabs" id="d-tabs" role="tablist" aria-label="Card sections"></nav>
    <div class="pane" id="pane" role="tabpanel"></div>
    <button class="close" id="d-close" data-close>Close</button>
  </aside>
</main>
<script>
"use strict";
const LANES = [["Inbox", "Ready for Refinement"], ["Technical Refinement"], ["Spec Review", "Ready for Dev"], ["Coding"], ["Validation"], ["Staged", "Ready for Prod"], ["Done"]];
const HUMAN = new Set(["Inbox", "Ready for Refinement", "Spec Review", "Ready for Dev", "Staged", "Ready for Prod"]);
const STALE_S = 300;  // a board snapshot older than this is called out
const DONE_SHOWN = 5;
const COLUMNS = ["Inbox", "Ready for Refinement", "Technical Refinement", "Spec Review", "Ready for Dev", "Coding", "Validation", "Staged", "Ready for Prod", "Done"];
const OWNER = { "Spec Review": ["Ready for Dev", "Ready for Refinement"], "Staged": ["Ready for Prod", "Coding"] };
const OK_OUTCOMES = new Set(["ok", "done", "pass", "passed", "success", "merged", "shipped"]);
const BAD_OUTCOMES = new Set(["fail", "failed", "error", "blocked"]);
const token = new URLSearchParams(location.search).get("t") || "";
const S = { overview: null, project: null, open: null, card: null, tab: "sessions", log: null, logNext: -1, logText: "", moving: {}, offline: false, error: "",
  expanded: {}, review: {}, notice: {}, armed: null, busy: false, showDone: false };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sel = (key) => `[data-open="${CSS.escape(key)}"]`;

// Every region is rewritten only when its markup changed, so polling keeps focus, scroll and typed text.
function setHTML(el, html) { if (el._html === html) return false; el._html = html; el.innerHTML = html; tick(el); return true; }
function tick(root = document) { root.querySelectorAll("[data-since]").forEach((el) => { el.textContent = elapsed(el.dataset.since); }); }

async function api(path, opts = {}) {
  try {
    const r = await fetch(path, { ...opts, headers: { "X-Aghanim-Token": token, "Content-Type": "application/json", ...(opts.headers || {}) } });
    const body = await r.json().catch(() => ({}));
    setOffline(false);
    return { status: r.status, body };
  } catch (e) {
    setOffline(true);
    return { status: 0, body: { error: "the dashboard server is not answering" } };
  }
}
function setOffline(v) { if (S.offline !== v) { S.offline = v; renderFlags(); } }
function setError(v) { if (S.error !== v) { S.error = v; renderFlags(); } }

const money = (v) => v == null ? '<span class="unpriced" title="A model in this card has no price. Add it to ~/.aghanim/prices.yml.">$ ?</span>' : `<span class="coin">${v.toFixed(2)}</span>`;
const EST = '<span class="est" title="Estimated from the run transcripts\' tokens and ~/.aghanim/prices.yml">est.</span>';
const UNTITLED = '<span class="untitled" title="The dashboard could not read the issue titles from GitHub (gh).">Title not loaded</span>';
const outcome = (o) => { const v = String(o || "").toLowerCase(); return OK_OUTCOMES.has(v) ? "ok" : BAD_OUTCOMES.has(v) ? "bad" : "muted"; };
function tok(n) { if (!n) return "–"; if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M"; if (n >= 1e3) return Math.round(n / 1e3) + "k"; return String(n); }
function when(iso) { if (!iso) return "–"; const d = new Date(iso); const t = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString(undefined, { day: "2-digit", month: "2-digit" }) + " " + t; }
function dur(a, b) { if (!a || !b) return "–"; const s = Math.max(0, (new Date(b) - new Date(a)) / 1000); if (s < 3600) return Math.round(s / 60) + "m"; return Math.floor(s / 3600) + "h" + String(Math.round((s % 3600) / 60)).padStart(2, "0"); }
const liveRun = (p, n, stage) => S.overview?.runs.find((r) => r.project === p && r.issue === n && r.stage === stage && !r.orphan)?.started || null;
const last = (sessions, stage) => sessions.filter((x) => x.stage === stage).pop();
function clock(since, bare) { return since ? `<span class="${bare ? "" : "clock "}num" data-since="${esc(since)}"></span>` : ""; }
function elapsed(since) {
  const s = Math.max(0, Math.floor((Date.now() - new Date(since)) / 1000));
  if (s < 3600) return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  return `${Math.floor(s / 3600)}h ${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}m`;
}
function ago(s) { if (s == null) return "no board snapshot yet"; if (s < 90) return `board read ${s}s ago`; return `board read ${Math.round(s / 60)} min ago`; }
const model = (m) => (m || "").replace(/^claude-/, "").replace(/-(\d+)-(\d+)$/, " $1.$2");
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

/* overview */
async function loadOverview() {
  const { status, body } = await api("/api/overview");
  if (status === 403) { setHTML($("board"), '<p class="placeholder">This link belongs to an earlier run of the dashboard. Open the URL that <code>aghanim dashboard</code> printed.</p>'); return; }
  if (status !== 200) { if (status) setError(body.error || `the overview answered ${status}`); return; }
  setError("");
  S.overview = body;
  if (!S.project || !body.projects.some((p) => p.slug === S.project)) S.project = body.projects[0]?.slug || null;
  for (const key of Object.keys(S.moving)) {
    const [p, n] = key.split("/"); const card = cardOf(p, +n);
    if (!card || card.column === S.moving[key]) delete S.moving[key];
  }
  renderStrip(); renderBoard(); if (S.open) renderDrawer();
}
const project = () => S.overview?.projects.find((p) => p.slug === S.project);
const cardOf = (p, n) => S.overview?.projects.find((x) => x.slug === p)?.cards.find((c) => c.issue === n);
const waiting = () => (S.overview?.projects || []).flatMap((p) => p.cards.map((c) => ({ ...c, key: `${p.slug}/${c.issue}` })))
  .filter((c) => c.awaiting && !(c.key in S.moving));

function renderStrip() {
  const o = S.overview;
  setHTML($("pool"), `${o.pool.used}<small>/${o.pool.size}</small>`);
  setHTML($("slots"), Object.entries(o.pool.stages).map(([st, v]) =>
    `<div class="slot"><div class="v num">${v.running}<small>/${v.slots}</small></div><div class="k">${esc(st)}</div><div class="meter"><i style="width:${v.slots ? Math.round(100 * v.running / v.slots) : 0}%"></i></div></div>`).join(""));
  $("today").textContent = o.today.runs;
  setHTML($("today-k"), `runs today · <span class="ok">${o.today.ok} ok</span>${o.today.failed ? ` · <span class="bad">${o.today.failed} failed</span>` : ""}`);
  setHTML($("cost"), `<span class="coin">${o.today.cost.toFixed(2)}</span>`);
  const slots = o.stacks || [], busy = slots.filter((x) => x.state !== "free").length, stuck = slots.some((x) => x.state === "stuck");
  setHTML($("stacks"), `${busy}<small>/${slots.length}</small>`);
  $("stacks-k").textContent = `stacks${o.queue ? ` · +${o.queue} waiting` : ""}`;
  $("stacks-cell").className = `stat stacks${stuck ? " stuck" : ""}`;
  $("stacks-cell").title = slots.map((x) => `slot ${x.slot}: ${x.state}${x.owner !== "-" ? ` ${x.owner}` : ""}${x.state !== "free" ? ` ${elapsed(new Date(Date.now() - x.held_s * 1000))}` : ""}${x.reason ? ` (${x.reason})` : ""}`).join("\n");
  const w = waiting();
  $("await-n").textContent = w.length;
  $("await").classList.toggle("none", !w.length);
  setHTML($("await-list"), w.map((c) => `<button data-open="${esc(c.key)}" title="${esc(c.column)}${c.title ? `: ${esc(c.title)}` : ""}" aria-label="#${c.issue}, ${esc(c.column)}${c.title ? `: ${esc(c.title)}` : ""}">#${c.issue}</button>`).join(""));
  renderFlags();
}
function renderFlags() {
  const o = S.overview; const f = [];
  if (S.offline) f.push('<span class="flag bad" title="The dashboard server is not answering. Is aghanim dashboard still running?">offline</span>');
  else if (S.error) f.push(`<span class="flag bad" title="${esc(S.error)}">not updating</span>`);
  if (o?.paused) f.push('<span class="flag warn">paused</span>');
  if (o?.usage_limited) f.push('<span class="flag warn">usage limit hit</span>');
  const orphans = (o?.runs || []).filter((r) => r.orphan);
  if (orphans.length) f.push(`<span class="flag warn" title="${orphans.map((r) => `${r.stage}-${r.issue}.lock`).join(", ")}">${plural(orphans.length, "orphaned lock")}</span>`);
  if (o && o.projects.length > 1) f.push(`<select id="proj" aria-label="Project">${o.projects.map((p) => `<option ${p.slug === S.project ? "selected" : ""}>${esc(p.slug)}</option>`).join("")}</select>`);
  const p = project();
  if (p && stale(p)) f.push(`<span class="flag warn" title="The dispatcher has not refreshed the board snapshot for ${Math.round(p.board_age_s / 60)} minutes: columns may be out of date. Approve and Request changes still read the live board before they move a card.">board ${Math.round(p.board_age_s / 60)} min old</span>`);
  if (!f.length && o) f.push('<span class="flag">running</span>');
  setHTML($("flags"), f.join(""));
  $("age").textContent = p ? ago(p.board_age_s) + (p.paused ? " · project paused" : "") : "";
}

const stale = (p) => p?.board_age_s != null && p.board_age_s > STALE_S;
function renderBoard() {
  const p = project();
  if (!p) { setHTML($("board"), '<p class="placeholder">No project registered. Run <code>aghanim add &lt;repo&gt;</code>.</p>'); return; }
  const by = Object.fromEntries(COLUMNS.map((c) => [c, []]));
  for (const c of p.cards) (by[c.column] ||= []).push(c);
  const html = LANES.map((lane) => {
    const empty = lane.every((col) => !by[col].length);
    return `<div class="lane ${lane.length > 1 ? "pair" : ""} ${empty ? "none" : ""}">${lane.map((col) => {
      const cards = by[col]; const yours = HUMAN.has(col);
      // Done is history: show the last few, the rest on request
      const fold = col === "Done" && !S.showDone && cards.length > DONE_SHOWN + 1;
      const shown = fold ? cards.slice(-DONE_SHOWN) : cards;
      const more = fold ? `<button class="more-btn" data-done>Show ${cards.length - DONE_SHOWN} more</button>`
        : col === "Done" && S.showDone && cards.length > DONE_SHOWN + 1 ? '<button class="more-btn" data-done>Show fewer</button>' : "";
      return `<section class="col ${yours ? "owner" : ""}" aria-label="${esc(col)}, ${plural(cards.length, "card")}${yours ? ", yours" : ""}"><h2 title="${yours ? "Your column: cards wait here for you" : "Factory column: agents work these cards"}"><span>${esc(col)}</span>${yours ? '<span class="yours">yours</span>' : ""}<span class="n num">${cards.length || ""}</span></h2><div class="cards">${
        shown.map((c) => cardHtml(p.slug, c)).join("")}${more}</div></section>`;
    }).join("")}</div>`;
  }).join("");
  const focused = document.activeElement?.closest?.("#board [data-open]")?.dataset.open;
  if (setHTML($("board"), html)) {
    if (focused) $("board").querySelector(sel(focused))?.focus({ preventScroll: true });
    markOverflow();
  }
}
function markOverflow() {
  document.querySelectorAll("#board .cards").forEach((el) => el.classList.toggle("more", el.scrollHeight > el.clientHeight + 1 && el.scrollTop + el.clientHeight < el.scrollHeight - 4));
  const b = $("board"); b.classList.toggle("more-x", b.scrollWidth > b.clientWidth + 1 && b.scrollLeft + b.clientWidth < b.scrollWidth - 4);
}
function cardHtml(slug, c) {
  const key = `${slug}/${c.issue}`; const moving = key in S.moving;
  const cls = ["card", c.running ? "running" : "", c.awaiting && !moving ? "await" : "", moving ? "moving" : "", S.open === key ? "open" : ""].join(" ");
  const block = c.blocked ? `<div class="blocked ${c.blocked}">${c.blocked === "infra" ? "<b>infra</b> · retrying" : "<b>blocked</b> · needs you"}</div>` : "";
  const status = moving ? `moving to ${S.moving[key]}` : c.running ? `${c.running} running` : c.awaiting ? (c.column === "Staged" ? "ready to ship" : "spec to review") : c.column;
  const label = `#${c.issue} ${c.title || ""}. ${status}${c.blocked ? `, ${c.blocked === "infra" ? "blocked by infrastructure" : "blocked"}` : ""}${c.cost ? `, cost ${c.cost.toFixed(2)} estimated` : ""}`;
  const extra = moving ? `<div class="waits">moving to ${esc(S.moving[key])}…</div>`
    : c.running ? `<div class="run"><span class="dial" aria-hidden="true"></span>${esc(c.running)} running${clock(liveRun(slug, c.issue, c.running))}</div>`
    : c.awaiting ? `<div class="waits">${c.column === "Staged" ? "ready to ship" : "spec to review"}</div>` : "";
  // gold stays rare: a finished card's cost is history, not a decision
  const cost = c.cost === null ? money(null) : !c.cost ? "" : c.column === "Done" ? `<span class="spent">${c.cost.toFixed(2)}</span>` : money(c.cost);
  return `<button class="${cls}" data-open="${esc(key)}" aria-label="${esc(label)}"><div class="top"><span class="no num">#${c.issue}</span><span class="cost num gold">${cost}</span></div>
    <div class="title">${c.title ? esc(c.title) : UNTITLED}</div>${extra}${block}</button>`;
}

/* drawer */
async function openCard(key, tab) {
  const same = S.open === key; const [p, n] = key.split("/"); const ov = cardOf(p, +n);
  S.tab = tab || (same && S.tab) || (ov && OWNER[ov.column] ? "review" : "sessions");
  if (!same) { S.card = null; S.log = null; S.logNext = -1; S.logText = ""; S.armed = null; }
  S.open = key;
  renderBoard(); renderDrawer();
  $("tip-title")?.focus({ preventScroll: true });
  await loadCard();
}
function closeCard() {
  const key = S.open; S.open = null; S.card = null; renderBoard(); renderDrawer();
  if (key) $("board").querySelector(sel(key))?.focus({ preventScroll: true });
}
async function loadCard() {
  if (!S.open) return;
  const [p, n] = S.open.split("/");
  const { status, body } = await api(`/api/card/${encodeURIComponent(p)}/${n}`);
  if (status !== 200 || S.open !== `${p}/${n}`) return;
  S.card = body;
  if (!S.log) S.log = [...body.runs].reverse()[0]?.log || null;
  renderDrawer();
}
function renderDrawer() {
  const d = $("drawer");
  const [op, on] = (S.open || "/").split("/"); const col = S.card?.column || cardOf(op, +on)?.column;
  d.className = "drawer" + (S.open ? " open" : "") + (S.open && (OWNER[col] || S.tab === "review") ? " wide" : "") + (S.busy ? " busy" : "");
  d.inert = !S.open;
  if (!S.open) { ["d-head", "d-decide", "d-tabs", "pane"].forEach((id) => setHTML($(id), "")); return; }
  const c = S.card; const [p, n] = S.open.split("/"); const ov = cardOf(p, +n);
  const column = c?.column || ov?.column || "";
  const onTitle = document.activeElement?.id === "tip-title";
  if (setHTML($("d-head"), headHtml(c, ov, p, n, column)) && onTitle) $("tip-title").focus({ preventScroll: true });
  renderDecide(p, n, column);
  const tabs = [["sessions", "Sessions", c ? c.sessions.length : ""], ["log", "Log", c ? new Set(c.runs.map((x) => x.log)).size || "" : ""], ["gates", "Gates", c?.reports.length || ""], ["review", "Review", ""]];
  setHTML($("d-tabs"), tabs.map(([id, label, b]) => `<button role="tab" id="tab-${id}" aria-controls="pane" aria-selected="${S.tab === id}" tabindex="${S.tab === id ? 0 : -1}" data-tab="${id}">${label}${b !== "" ? `<span class="b num">${b}</span>` : ""}</button>`).join(""));
  $("pane").setAttribute("aria-labelledby", `tab-${S.tab}`);
  if (setHTML($("pane"), c ? pane(c, p, n, column) : '<div class="skeleton"></div><div class="skeleton" style="width:70%"></div>') && S.tab === "log" && $("log")) {
    $("log").textContent = S.logText || "Loading…";
  }
}
function headHtml(c, ov, p, n, column) {
  const sessions = c?.sessions || [];
  const span = sessions.length ? dur(sessions[0].start, sessions[sessions.length - 1].end) : "–";
  const title = c?.title || ov?.title || "";
  const moving = S.moving[`${p}/${n}`];
  const state = moving ? `<span class="wait">moving to ${esc(moving)}…</span>`
    : ov?.running ? `<span class="live"><span class="dial" aria-hidden="true"></span>${esc(ov.running)} running ${clock(liveRun(p, +n, ov.running), true)}</span>`
    : OWNER[column] ? `<span class="wait">waits for you: ${column === "Staged" ? "ready to ship" : "spec to review"}</span>` : "";
  const rep = c?.reports.length ? c.reports[c.reports.length - 1] : null;
  const issue = c?.repo ? `<a href="https://github.com/${esc(c.repo)}/issues/${n}" target="_blank" rel="noopener">issue on GitHub</a>` : "";
  const earlier = rep && ov?.running && rep.pipeline !== ov.running ? ` <span class="muted">(before ${esc(ov.running)})</span>` : "";
  return `<div class="tip-head"><div class="row1"><h3 id="tip-title" tabindex="-1"><span class="num">#${n}</span>${title ? esc(title) : UNTITLED}</h3></div>
    <div class="meta"><span>${esc(column || "–")}</span>${state}${issue ? `<span>${issue}</span>` : ""}</div>
    <dl class="tip-stats">
      <div class="total"><dt>cost, Inbox to now ${EST}</dt><dd class="num gold">${c ? money(c.total) : "–"}</dd></div>
      <div><dt>sessions</dt><dd class="num">${c ? sessions.length : "–"}</dd></div>
      <div><dt>first to last run</dt><dd class="num">${span}</dd></div>
      <div class="report"><dt>last report</dt><dd>${rep ? `${esc(rep.pipeline)} <span class="${outcome(rep.outcome)}">${esc(rep.outcome)}</span>${earlier}` : '<span class="muted">none yet</span>'}</dd></div>
    </dl>
    ${c?.blocked ? blockNote(c) : ""}</div>`;
}
// The block reason is the factory's issue comment, in markdown: lead with what the owner must decide
// and the failed gate, and fold the full report.
function blockNote(c) {
  const src = c.block_reason || ""; const plain = (s) => s.replace(/\*\*/g, "").replace(/`/g, "").replace(/^\s*[-*]\s*/, "").trim();
  const line = (re) => src.split(/\r?\n/).find((l) => re.test(l)) || "";
  const decide = plain(line(/must decide|owner must|needs? you to/i)).replace(/^[^:]*(must decide|owner must|needs? you to)[^:]*:\s*/i, "");
  const gate = (src.match(/failed gates?:\**\s*([^.\n]+)/i) || [])[1] || "";
  const infra = c.blocked === "infra";
  return `<div class="block-note ${esc(c.blocked)}"><div class="bn-k"><b>Blocked</b> · ${infra ? "infrastructure failed; the factory retries once" : "the factory stopped and waits for your call"}</div>
    ${decide ? `<p class="bn-lead">${inline(decide.charAt(0).toUpperCase() + decide.slice(1))}</p>` : ""}
    ${gate ? `<p class="bn-gate">Failed gate: ${inline(gate.trim())}</p>` : ""}
    <button class="btn" data-unblock>Unblock &amp; retry</button>
    ${src ? `<details><summary>Full report</summary><div class="md">${mdLite(src)}</div></details>` : ""}
    <div class="bn-err" id="bn-err" role="status"></div></div>`;
}
const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
// enough markdown for the factory's reports: headings, bullets (with continuation lines), code fences
function mdLite(src) {
  const out = []; let list = false, code = null;
  const put = (html) => { if (list) out[out.length - 1] = out[out.length - 1].replace(/<\/li>$/, html + "</li>"); else out.push(html); };
  for (const raw of src.split(/\r?\n/)) {
    const l = raw.replace(/\s+$/, "");
    if (/^\s*```/.test(l)) { if (code) { put(`<pre>${esc(code.join("\n"))}</pre>`); code = null; } else code = []; continue; }
    if (code) { code.push(l.replace(/^\s{0,4}/, "")); continue; }
    const li = l.match(/^\s*[-*] (.*)/);
    if (li) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(li[1])}</li>`); continue; }
    if (list && /^\s{2,}\S/.test(l)) { put(" " + inline(l.trim())); continue; }
    if (list && l.trim()) { out.push("</ul>"); list = false; }
    if (!l.trim()) continue;
    const h = l.match(/^#{1,6}\s+(.*)/);
    out.push(h ? `<p class="h">${inline(h[1])}</p>` : `<p>${inline(l)}</p>`);
  }
  if (code) put(`<pre>${esc(code.join("\n"))}</pre>`);
  if (list) out.push("</ul>");
  return out.join("");
}
function renderDecide(p, n, column) {
  const key = `${p}/${n}`; const moves = OWNER[column]; const el = $("d-decide"); const note = S.notice[key];
  const notice = `<div class="notice ${note?.cls || ""}" id="notice" role="status" aria-live="polite">${note?.html || ""}</div>`;
  const html = S.moving[key] ? `<div class="decide">${notice}</div>`
    : moves ? `<div class="decide" role="group" aria-labelledby="decide-k">
      <div class="decide-k"><b id="decide-k">Your decision</b><span id="rv-progress" class="num"></span></div>
      ${stale(project()) ? `<p class="stale">The board snapshot is ${Math.round(project().board_age_s / 60)} min old. Approve and Request changes read the live board first and stop if the card moved.</p>` : ""}
      <div class="decide-a"><button class="btn approve" id="approve" data-act="approve" data-label="Approve → ${esc(moves[0])}">Approve → ${esc(moves[0])}</button><span class="hint" id="approve-hint"></span></div>
      <div class="decide-b"><textarea id="changes" aria-label="What should change" placeholder="What should change (posted on the issue)"></textarea>
        <div class="acts"><button class="btn" id="request" data-act="request-changes">Request changes → ${esc(moves[1])}</button><button class="btn ghost" id="fill" hidden></button></div></div>
      ${notice}</div>`
    : note ? `<div class="decide">${notice}</div>` : "";
  const text = $("changes")?.value; const focused = document.activeElement?.id;
  if (setHTML(el, html)) {
    if (text && $("changes")) { $("changes").value = text; $("changes").classList.add("show"); }
    if (focused && el.contains($(focused))) $(focused).focus();
  }
  syncDecide();
}
// The review page reports its marks; Approve stays possible but asks twice while the review has
// unreviewed items or asks for changes.
function reviewDoubt(r) {
  if (!r?.total) return "";
  const pending = r.total - r.done;
  return pending > 0 ? `${pending} not reviewed` : r.changes.length ? `${plural(r.changes.length, "change")} asked` : "";
}
function syncDecide() {
  const a = $("approve"); if (!a) return;
  const r = S.review[S.open]; const doubt = reviewDoubt(r); const armed = S.armed === S.open && !!doubt;
  $("rv-progress").textContent = r?.total ? `${r.done} of ${r.total} reviewed${r.changes.length ? ` · ${plural(r.changes.length, "change")}` : ""}`
    : r ? "nothing to mark in the review" : S.card && !S.card.review ? "no review page" : "";
  a.classList.toggle("soft", !!doubt);
  a.textContent = armed ? `Approve with ${doubt}` : a.dataset.label;
  $("approve-hint").textContent = armed ? "Click again to move it anyway." : doubt ? (r.done < r.total ? `${plural(r.total - r.done, "item")} not reviewed yet` : `The review asks for ${plural(r.changes.length, "change")}.`) : "";
  const t = $("changes"); const typed = !!t.value.trim();
  t.classList.toggle("filled", typed);
  // a narrow drawer folds the textarea behind Request changes: the first click opens it
  const folded = getComputedStyle(t).display === "none";
  a.disabled = S.busy; $("request").disabled = S.busy || (!typed && !folded);
  const f = $("fill"); f.hidden = !r?.changes.length;
  if (r?.changes.length) f.textContent = `Use the review's ${plural(r.changes.length, "change")}`;
}

function pane(c, p, n, column) {
  if (S.tab === "sessions") return sessionsPane(c);
  if (S.tab === "log") return logPane(c);
  if (S.tab === "gates") return gatesPane(c);
  return reviewPane(c, p, n, column);
}
function sessionsPane(c) {
  if (!c.sessions.length) return '<p class="placeholder">No factory session for this card yet. Sessions appear here once the dispatcher runs a stage for it.</p>';
  const cache = (t) => tok(t.cache_read + t.cache_write_5m + t.cache_write_1h);
  const cacheTitle = (t) => `read ${tok(t.cache_read)} · written ${tok(t.cache_write_5m + t.cache_write_1h)}`;
  const rows = c.sessions.map((s) => {
    const m = Object.keys(s.tokens); const t = sum(s.tokens);
    const subs = s.subagents.length ? `<button class="subtoggle" data-sub="${esc(s.id)}" aria-expanded="${!!S.expanded[s.id]}">+${s.subagents.length} sub</button>` : "";
    const live = s.exit == null && s.log && s === last(c.sessions, s.stage) && liveRun(c.project, c.issue, s.stage);
    const exit = s.exit == null ? (s.log ? '<span class="muted">running</span>' : "–") : s.exit === 0 ? '<span class="ok">ok</span>' : `<span class="bad">exit ${s.exit}</span>`;
    let html = `<tr class="session" data-log="${esc(s.log || "")}" title="${esc(m.map(model).join(", "))}"><td class="l num" title="${esc(new Date(s.start).toLocaleString())}">${when(s.start)}</td><td class="l">${esc(s.stage)} <span class="muted">${esc(m.map(model).join(", "))}</span>${subs}</td>
      <td class="num">${tok(t.input)}</td><td class="num">${tok(t.output)}</td><td class="num" title="${cacheTitle(t)}">${cache(t)}</td>
      <td class="num">${live ? clock(live, true) : dur(s.start, s.end)}</td><td>${exit}</td><td class="num gold">${money(s.cost)}</td></tr>`;
    if (S.expanded[s.id]) html += s.subagents.map((a) => { const u = sum(a.tokens); return `<tr class="sub"><td class="l"></td><td class="l">subagent <span class="muted">${esc(Object.keys(a.tokens).map(model).join(", "))}</span></td>
      <td class="num">${tok(u.input)}</td><td class="num">${tok(u.output)}</td><td class="num" title="${cacheTitle(u)}">${cache(u)}</td><td></td><td></td><td class="num">${money(a.cost)}</td></tr>`; }).join("");
    return html;
  }).join("");
  return `<div class="section-k">Cost by session</div><table><thead><tr><th class="l">start</th><th class="l">stage · model</th><th>input</th><th>output</th><th title="Cache read plus cache written; hover a row for the split">cache</th><th>time</th><th>result</th><th>cost ${EST}</th></tr></thead>
    <tbody>${rows}<tr class="total"><td class="l" colspan="7">Total, Inbox to now</td><td class="num gold">${money(c.total)}</td></tr></tbody></table>`;
}
function sum(tokens) {
  const t = { input: 0, cache_write_5m: 0, cache_write_1h: 0, cache_read: 0, output: 0 };
  for (const m of Object.values(tokens)) for (const k in t) t[k] += m[k] || 0;
  return t;
}
function logPane(c) {
  const logs = [...new Set(c.runs.map((r) => r.log))].reverse();
  if (!logs.length) return '<p class="placeholder">No log for this card yet.</p>';
  return `<div class="logwrap"><div class="logbar">Log <select id="logsel" aria-label="Log file">${logs.map((l) => `<option ${l === S.log ? "selected" : ""}>${esc(l)}</option>`).join("")}</select><span>follows while open</span></div>
    <pre class="log" id="log" tabindex="0"></pre></div>`;
}
function gatesPane(c) {
  if (!c.reports.length) return '<p class="placeholder">No report yet. Each stage writes one when it ends.</p>';
  return [...c.reports].reverse().map((r) => {
    const gates = Object.entries(r.gates || {});
    const failed = new Set(r.failed_gates || []);
    const list = gates.map(([g, v]) => `<span class="gate ${v === "pass" && !failed.has(g) ? "pass" : "fail"}">${esc(g)} ${esc(v)}</span>`).join("");
    return `<div class="gate-run"><div class="h"><b>${esc(r.pipeline)}</b><span class="${outcome(r.outcome)}">${esc(r.outcome)}</span></div>
      ${list ? `<div class="gate-list">${list}</div>` : r.notes ? "" : '<div class="notes">No gates for this stage.</div>'}
      ${r.notes ? `<div class="notes">${esc(r.notes)}</div>` : ""}</div>`;
  }).join("");
}
function reviewPane(c, p, n, column) {
  const none = OWNER[column] ? "" : `<p class="none">Nothing to decide: the card is in ${esc(column || "no column")}. Approval opens in Spec Review and Staged.</p>`;
  const page = c.review ? `<iframe title="Review page for #${esc(n)}" sandbox="allow-scripts" src="/review/${encodeURIComponent(p)}/${n}?embed=1&t=${encodeURIComponent(token)}"></iframe>` : '<p class="placeholder">No review page for this card. Refine builds it when the spec is ready.</p>';
  return `<div class="review">${none}${page}</div>`;
}

async function act(action, moveOnly) {
  const key = S.open; const [p, n] = key.split("/"); const column = S.card?.column || cardOf(p, +n)?.column;
  if (action === "request-changes" && $("changes") && getComputedStyle($("changes")).display === "none") {
    $("changes").classList.add("show"); $("changes").focus(); syncDecide(); return;
  }
  if (action === "approve" && !moveOnly && reviewDoubt(S.review[key]) && S.armed !== key) {
    S.armed = key; syncDecide();
    clearTimeout(S.armTimer); S.armTimer = setTimeout(() => { if (S.armed === key) { S.armed = null; syncDecide(); } }, 4000);
    return;
  }
  S.armed = null; delete S.notice[key];
  const text = $("changes")?.value || "";
  S.busy = true; renderDrawer();
  const { status, body } = await api(`/api/card/${encodeURIComponent(p)}/${n}/${action}`, { method: "POST", body: JSON.stringify({ column, text, move_only: !!moveOnly }) });
  S.busy = false;
  if (status === 200) {
    S.moving[key] = body.moved_to;
    const next = waiting().find((c) => c.key !== key);
    S.notice[key] = { cls: "good", html: `Moved to ${esc(body.moved_to)}. The board confirms it on the dispatcher's next read.${next ? ` <button class="btn ghost" data-open="${esc(next.key)}">Next waiting: #${next.issue}</button>` : " Nothing else waits for you."}` };
    renderStrip(); renderBoard(); renderDrawer(); return;
  }
  S.notice[key] = status === 502 && body.commented
    ? { cls: "", html: `${esc(body.error)}. The comment is on the issue. <button class="btn" data-retry="${esc(action)}">Retry the move</button>` }
    : { cls: "", html: esc(body.error || "The action failed.") };
  if (status === 409) await loadCard();
  renderDrawer();
}

let tailing = false;
async function unblock() {
  const [p, n] = S.open.split("/");
  const { status, body } = await api(`/api/card/${encodeURIComponent(p)}/${n}/unblock`, { method: "POST", body: "{}" });
  if (status !== 200) {
    if ($("bn-err")) $("bn-err").textContent = body.error || "Unblock failed.";
    return;
  }
  await loadCard(); loadOverview();
}

async function followLog() {
  if (tailing || !S.open || S.tab !== "log" || !S.log) return;
  const [p] = S.open.split("/"); const log = S.log; const first = S.logNext === -1;
  tailing = true;
  const { status, body } = await api(`/api/log/${encodeURIComponent(p)}/${encodeURIComponent(log)}?from=${S.logNext}`).finally(() => { tailing = false; });
  if (status !== 200 || log !== S.log) return;
  const pre = $("log");
  if (body.text) {
    S.logText += body.text;
    if (pre) {
      const box = pre; const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
      pre.textContent = S.logText;
      if (atEnd || first) box.scrollTop = box.scrollHeight;
    }
  } else if (pre && !S.logText) pre.textContent = "(empty)";
  S.logNext = body.next;
}
function selectTab(id) { S.tab = id; renderDrawer(); if (id === "log") followLog(); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-open],[data-close],[data-tab],[data-sub],[data-act],[data-retry],#fill,[data-unblock],[data-done],tr.session");
  if (!t) return;
  if (t.dataset.open) openCard(t.dataset.open);
  else if (t.hasAttribute("data-close")) closeCard();
  else if (t.dataset.tab) selectTab(t.dataset.tab);
  else if (t.dataset.sub) { e.stopPropagation(); S.expanded[t.dataset.sub] = !S.expanded[t.dataset.sub]; renderDrawer(); }
  else if (t.dataset.act) act(t.dataset.act);
  else if (t.dataset.retry) act(t.dataset.retry, true);
  else if (t.hasAttribute("data-unblock")) unblock();
  else if (t.hasAttribute("data-done")) { S.showDone = !S.showDone; renderBoard(); }
  else if (t.id === "fill") { const r = S.review[S.open]; $("changes").value = r.changes.join("\n"); syncDecide(); $("changes").focus(); }
  else if (t.matches("tr.session") && t.dataset.log) { S.log = t.dataset.log; S.logNext = -1; S.logText = ""; selectTab("log"); }
});
document.addEventListener("input", (e) => { if (e.target.id === "changes") syncDecide(); });
document.addEventListener("change", (e) => {
  if (e.target.id === "logsel") { S.log = e.target.value; S.logNext = -1; S.logText = ""; renderDrawer(); followLog(); }
  if (e.target.id === "proj") { S.project = e.target.value; closeCard(); renderStrip(); renderBoard(); }
});
document.addEventListener("keydown", (e) => {
  const typing = e.target.closest?.("textarea, input, select");
  if (e.key === "Escape" && S.open && !typing) { closeCard(); return; }
  const tab = e.target.closest?.('[role="tab"]');
  if (tab && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
    e.preventDefault();
    const ids = [...document.querySelectorAll('#d-tabs [role="tab"]')].map((b) => b.dataset.tab); let i = ids.indexOf(tab.dataset.tab);
    i = e.key === "Home" ? 0 : e.key === "End" ? ids.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + ids.length) % ids.length;
    selectTab(ids[i]); $(`tab-${ids[i]}`)?.focus();
    return;
  }
  if (e.key === "n" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const w = waiting(); if (!w.length) return;
    const i = w.findIndex((c) => c.key === S.open); openCard(w[(i + 1) % w.length].key);
  }
});
// review pages run sandboxed; the dashboard's embed script posts their marks here
window.addEventListener("message", (e) => {
  const f = document.querySelector("#pane iframe"); const m = e.data;
  if (!f || e.source !== f.contentWindow || !S.open || !m || m.aghanim !== "review-progress") return;
  S.review[S.open] = { done: Math.max(0, +m.done || 0), total: Math.max(0, +m.total || 0), changes: Array.isArray(m.changes) ? m.changes.slice(0, 200).map(String) : [] };
  syncDecide();
});
document.addEventListener("scroll", (e) => { if (e.target.classList?.contains("cards") || e.target.id === "board") markOverflow(); }, true);
window.addEventListener("resize", markOverflow);

loadOverview();
setTimeout(() => { if (!S.overview && $("board")._html === undefined) setHTML($("board"), '<p class="placeholder">Still reading the factory. The first read parses every run transcript and asks GitHub for the issue titles, so it can take a few seconds.</p>'); }, 6000);
setInterval(loadOverview, 5000);
setInterval(() => { if (S.open && S.tab !== "log") loadCard(); }, 5000);
setInterval(followLog, 2000);
setInterval(() => tick(), 1000);
</script>
</body>
